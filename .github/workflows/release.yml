# Pachetele și publicarea (specul, „GitHub Actions”).
# La push pe executie/publicare și la workflow_dispatch: construiește și probează pachetele.
# La o etichetă v*: în plus, depozitul APT pe Pages și Release-ul. Pages cere depozitul public, pe planul Free.
name: release

on:
  push:
    tags: ['v*']
    branches: [executie/publicare]
  workflow_dispatch:

permissions:
  contents: read

env:
  CT: docker

jobs:
  packages:
    # the private development copy never releases
    if: github.repository == 'Redaudacious/bisonus-macro'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/build-deb.sh
      - run: bash packaging/build-rpm.sh
      - run: bash packaging/build-arch.sh
      - run: bash packaging/test-install.sh deb
      - run: bash packaging/test-install.sh deb-qt610
      - run: bash packaging/test-install.sh rpm
      - run: bash packaging/test-install.sh arch
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build-pachete/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build-pachete
      - name: The tag is the version from CMakeLists.txt
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^project(bisonus-macro VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
      - name: The signing key is the key in install.sh
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          grep -qx "KEY_FPR=\"$fpr\"" install.sh
          echo "KEY_FPR=$fpr" >> "$GITHUB_ENV"
      - run: sudo apt-get install -y apt-utils
      - run: bash packaging/apt-repo.sh build-pachete site "$KEY_FPR"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh build-pachete/
          bash packaging/note-versiune.sh "$GITHUB_REF_NAME" > build-pachete/NOTE.md
          test -s build-pachete/NOTE.md # o versiune fără secțiune în CHANGELOG.md oprește Release-ul
          cd build-pachete
          sha256sum ./*.deb ./*.rpm ./*.pkg.tar.zst install.sh > SHA256SUMS
          gpg --batch --yes --local-user "$KEY_FPR" --armor --detach-sign -o SHA256SUMS.asc SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.deb ./*.rpm ./*.pkg.tar.zst install.sh SHA256SUMS SHA256SUMS.asc --title "$GITHUB_REF_NAME" --notes-file NOTE.md
